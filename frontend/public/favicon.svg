<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sunrise Warm Gradient (Empowerment & Energy) -->
    <linearGradient id="brandWarm" x1="12" y1="46" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="55%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Foundation / Knowledge Cool Gradient -->
    <linearGradient id="brandCool" x1="13" y1="38" x2="51" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow for Rising Sun -->
    <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle for universal contrast across light/dark tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#312E81" stroke-width="1.5" />

  <!-- Rising Sun of Hope & Girl-Child Empowerment -->
  <circle cx="32" cy="18" r="4.5" fill="url(#brandWarm)" filter="url(#sunGlow)" />
  <!-- Radiant Rays -->
  <path d="M 32 9 V 11 M 32 25 V 27 M 23 18 H 25 M 39 18 H 41 M 25.5 11.5 L 27 13 M 38.5 11.5 L 37 13"
        stroke="url(#brandWarm)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Setu (The Arching Bridge) -->
  <path d="M 13 36 C 22 25, 42 25, 51 36"
        stroke="url(#brandWarm)" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Suspension Lines -->
  <path d="M 22 30.5 V 37 M 32 27 V 38 M 42 30.5 V 37"
        stroke="url(#brandWarm)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Shiksha (Open Book Foundation) -->
  <!-- Left Page -->
  <path d="M 32 41 C 26 38.5, 18 38.5, 13 40.5 V 46.5 C 18 44.5, 26 44.5, 32 47 Z"
        fill="url(#brandCool)" opacity="0.9" />
  <!-- Right Page -->
  <path d="M 32 41 C 38 38.5, 46 38.5, 51 40.5 V 46.5 C 46 44.5, 38 44.5, 32 47 Z"
        fill="url(#brandCool)" />
  <!-- Book Spine Spine Center Line -->
  <path d="M 32 41 V 47.5" stroke="#E2E8F0" stroke-width="1.25" stroke-linecap="round" />
</svg>
